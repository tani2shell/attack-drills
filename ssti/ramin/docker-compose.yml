services:
  ramin:
    build:
      context: ./app
      args:
        FLAG: ${FLAG:?FLAG build arg required — cp .env.example .env}
    container_name: ramin
    restart: unless-stopped
    ports:
      - "18983:5000"
    networks:
      net_ramin:
        ipv4_address: 172.31.252.82
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 256

networks:
  net_ramin:
    ipam:
      config:
        - subnet: 172.31.252.80/28
          gateway: 172.31.252.81
