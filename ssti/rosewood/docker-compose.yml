services:
  rosewood:
    build:
      context: ./app
      args:
        FLAG: ${FLAG:?FLAG build arg required — cp .env.example .env}
    container_name: rosewood
    restart: unless-stopped
    ports:
      - "18982:8080"
    networks:
      net_rosewood:
        ipv4_address: 172.31.252.66
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/index.php -o /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 256

networks:
  net_rosewood:
    ipam:
      config:
        - subnet: 172.31.252.64/28
          gateway: 172.31.252.65
