services:
  larch:
    build:
      context: ./app
      args:
        FLAG: ${FLAG:?FLAG build arg required — cp .env.example .env}
    container_name: larch
    restart: unless-stopped
    ports:
      - "18953:8000"
    networks:
      net_larch:
        ipv4_address: 172.31.28.2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/greet/?name=probe || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 256

networks:
  net_larch:
    ipam:
      config:
        - subnet: 172.31.28.0/28
          gateway: 172.31.28.1
