name: drill-fig
services:
  web:
    build:
      context: ./app/web
      secrets: [flag]
    ports:
      - "127.0.0.1:${HOST_PORT:-28904}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 30
    cpus: "1.0"
    mem_limit: 1024m
    restart: unless-stopped
    networks: [drill]
secrets:
  flag:
    file: ./flag.txt
networks:
  drill:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.224.0/24}
