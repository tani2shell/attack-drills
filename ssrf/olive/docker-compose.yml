# attack-drills/olive - one-shot lab (compose secret, no hardcoded flag)
name: attack-drills-olive
services:
  web:
    build:
      context: ./app
      secrets:
        - flag
    image: ssrf-drill-olive:latest
    ports:
      - "127.0.0.1:${HOST_PORT:-28957}:80"
    cpus: "1.0"
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [lab]
  internal:
    build:
      context: ./internal
      secrets:
        - flag
    image: ssrf-drill-olive-internal:latest
    expose:
      - "80"
    cpus: "0.5"
    mem_limit: 512m
    restart: unless-stopped
    networks: [lab]

secrets:
  flag:
    file: ./flag.txt
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.187.0/24}
