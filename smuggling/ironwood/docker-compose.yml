# attack-drills/ironwood — one-shot lab (four-service parser stack, compose secret)
name: attack-drills-ironwood
services:
  db:
    build:
      context: ./mysql
    image: attack-drills/ironwood-db:latest
    platform: linux/amd64
    cpus: "0.5"
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=***", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [lab]

  hrs_admin_router:
    build:
      context: ./app
      secrets:
        - flag
    image: attack-drills/ironwood-app:latest
    cpus: "1.0"
    mem_limit: 1024m
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [lab]

  haproxy:
    build:
      context: ./haproxy
    image: attack-drills/ironwood-lb:latest
    cpus: "0.25"
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      hrs_admin_router:
        condition: service_healthy
    expose:
      - "8001"
    environment:
      - SERVER_HOSTNAME=hrs_admin_router
      - SERVER_PORT=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [lab]

  mitmproxy:
    build:
      context: ./mitmproxy
    image: attack-drills/ironwood-edge:latest
    cpus: "0.5"
    mem_limit: 384m
    restart: unless-stopped
    depends_on:
      haproxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-28945}:8002"
    environment:
      - SERVER_HOSTNAME=haproxy
      - SERVER_PORT=8001
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8002), 2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [lab]

secrets:
  flag:
    file: ./flag.txt
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.174.0/24}
