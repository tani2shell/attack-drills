services:
  web:
    build:
      context: ./app
      args:
        FLAG: "${FLAG:?set FLAG in .env (see .env.example)}"
    image: xss-drill-quebracho:latest
    container_name: quebracho
    networks:
      net_quebracho:
        ipv4_address: 172.31.253.50
    ports:
      - "18976:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256

networks:
  net_quebracho:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.253.48/28
          gateway: 172.31.253.49
