# attack-drills/thuja - one-shot lab (compose secret, no hardcoded flag)
name: attack-drills-thuja
services:
  web:
    build:
      context: ./app
      secrets:
        - flag
    image: xss-drill-thuja:latest
    ports:
      - "127.0.0.1:${HOST_PORT:-28967}:5000"
    cpus: "1.0"
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib2; urllib2.urlopen('http://127.0.0.1:5000/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [lab]

secrets:
  flag:
    file: ./flag.txt
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.197.0/24}
