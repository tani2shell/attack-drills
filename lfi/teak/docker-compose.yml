# attack-drills/teak - one-shot lab (compose secret, no hardcoded flag)
name: attack-drills-teak
services:
  web:
    build:
      context: ./app
      secrets:
        - flag
    image: lfi-drill-teak:latest
    ports:
      - "127.0.0.1:${HOST_PORT:-28965}:80"
    cpus: "2.0"
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    networks: [lab]

secrets:
  flag:
    file: ./flag.txt
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.195.0/24}
