# attack-drills/sassafras - one-shot lab (compose secret, no hardcoded flag)
name: attack-drills-sassafras
services:
  web:
    build:
      context: ./app
      secrets:
        - flag
    ports:
      - "127.0.0.1:${HOST_PORT:-28911}:80"
      - "127.0.0.1:${SSH_PORT:-28942}:22"
    cpus: "1.0"
    mem_limit: 768m
    restart: unless-stopped
    networks: [lab]
secrets:
  flag:
    file: ./flag.txt
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.231.0/24}
