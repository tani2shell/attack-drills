name: drill-eucalyptus
services:
  skumodel:
    build:
      context: ./app/skumodel-srv
      secrets: [flag]
    ports:
      - "127.0.0.1:${SKU_PORT:-28968}:4455"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4455/index.php"]
      interval: 15s
      timeout: 5s
      retries: 30
    cpus: "1.0"
    mem_limit: 1024m
    restart: unless-stopped
    networks: [drill]
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      skumodel:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-28902}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/index.php"]
      interval: 15s
      timeout: 5s
      retries: 30
    cpus: "1.0"
    mem_limit: 1024m
    restart: unless-stopped
    networks: [drill]
secrets:
  flag:
    file: ./flag.txt
networks:
  drill:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.222.0/24}
