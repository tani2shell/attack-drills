# attack-drills/oak - one-shot lab (compose secret, no hardcoded flag)
name: attack-drills-oak
services:
  web:
    build:
      context: ./app
      secrets:
        - flag
    image: authz-drill-oak:latest
    ports:
      - "127.0.0.1:${HOST_PORT:-28956}:80"
    cpus: "1.0"
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [lab]

secrets:
  flag:
    file: ./flag.txt
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.186.0/24}
