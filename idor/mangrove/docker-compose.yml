# attack-drills/mangrove — one-shot lab (compose secret, no hardcoded flag)
name: attack-drills-mangrove
services:
  web:
    build:
      context: ./app
      secrets:
        - flag
    image: attack-drills/mangrove:latest
    ports:
      - "127.0.0.1:${HOST_PORT:-28949}:80"
    cpus: "1.0"
    mem_limit: 1024m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [lab]

secrets:
  flag:
    file: ./flag.txt
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.178.0/24}
