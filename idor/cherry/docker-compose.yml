# cherry - attack-drills wave-c practice drill
services:
  db:
    build:
      context: ./mysql
      args:
        FLAG_B64: ${FLAG_B64}
    cpus: "1.0"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pidor_broken_authn_trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - lab
  web:
    build:
      context: ./app
      args:
        FLAG_B64: ${FLAG_B64}
    ports:
      - "0.0.0.0:${HOST_PORT:-19021}:80"
    depends_on:
      db:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lab
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET:-172.31.211.0/24}
